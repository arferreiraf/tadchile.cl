<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio en Mantenimiento</title>
    <style>
        /* Estilos generales para centrar el contenido */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        /* Contenedor principal */
        .container {
            max-width: 600px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Icono o ilustración simple */
        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1em;
            line-height: 1.6;
            color: #666;
        }

        .contact-info {
            margin-top: 25px;
            font-size: 0.9em;
            color: #3498db;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🛠️</div>
        <h1>Estamos mejorando para ti</h1>
        <p>Nuestro sitio web se encuentra actualmente en mantenimiento programado. Estaremos de vuelta muy pronto con una mejor experiencia.</p>
        
        <div class="contact-info">
            Si necesitas asistencia urgente, escríbenos a: <strong>gestion.ucf@tadchile.cl</strong>
        </div>
    </div>

</body>
</html>
